[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantis"
version = "0.1.0"
description = "OHLCV indicator & pattern analysis engine with per-bar or last-bar output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "quantis" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
data = ["tickflow>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
